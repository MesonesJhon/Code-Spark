name: Publicar Code Spark en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Comprobar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar las pruebas
        run: npm test
      - name: Compilar para /Code-Spark/
        run: npm run build:pages
      - name: Preparar los archivos de publicación
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Publicar la página
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Comprobar la activación inicial de Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if pages_source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null) && [ "$pages_source" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages pendiente::Selecciona GitHub Actions en Settings > Pages y vuelve a ejecutar este workflow."
            {
              echo "## Publicación pendiente de activación"
              echo "Las pruebas y la compilación se completaron. La página todavía no se ha publicado."
              echo "1. Abre https://github.com/${GITHUB_REPOSITORY}/settings/pages"
              echo "2. En Build and deployment > Source, selecciona GitHub Actions."
              echo "3. Vuelve a Actions y ejecuta este workflow con Run workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configurar GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Desplegar
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
